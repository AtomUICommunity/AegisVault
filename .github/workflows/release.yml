name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build-macos:
        description: 'Also build the macOS artifacts (needs macOS runner minutes)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  changelog:
    name: changelog
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # CHANGELOG.md is the single source of truth for release notes: a tag
      # without a matching section fails here instead of after four AOT builds.
      - name: Require a CHANGELOG section for this tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if ! grep -qE "^## \[${version}\] " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section - add it before tagging"
            exit 1
          fi
          echo "found CHANGELOG section for ${version}"

  publish:
    name: publish (${{ matrix.rid }})
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            experimental: false
            macos: false
          - os: ubuntu-22.04
            rid: linux-x64
            experimental: false
            macos: false
          - os: macos-14
            rid: osx-arm64
            # Green since the SDK sysroot + dynamic-lookup workaround in
            # AegisVault.App.csproj (run 35426423612; dotnet/runtime#125858).
            experimental: false
            macos: true
          - os: macos-14
            rid: osx-x64
            # macos-13 is EOL; cross-arch AOT from the arm64 host is supported
            # by the SDK (Xcode ships both toolchains) and verified in
            # run 35426423612.
            experimental: false
            macos: true
    # macOS runners are skipped unless the dispatch asks for them. A tag push
    # builds Windows and Linux only, so a spent macOS minute quota cannot take
    # the whole release down: on 2026-11-12 both macOS jobs were cancelled one
    # second after they started, which made needs.publish.result != success and
    # skipped the release job even though Windows and Linux had built fine.
    #
    # This is an explicit dispatch input rather than a cheaper runner because
    # the two macOS artifacts are a documented part of every release; whoever
    # ships should see that they are missing instead of getting them silently
    # dropped. Re-dispatch with build-macos=true once the quota is back.
    if: ${{ !matrix.macos || (github.event_name == 'workflow_dispatch' && inputs.build-macos) }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Use official NuGet feed
        shell: bash
        run: |
          cat > nuget.config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF

      - name: Install Linux AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Diagnoses the NativeAOT/Swift link failures (dotnet/runtime#125858):
      # shows whether the SDK still ships the Swift compatibility stubs.
      - name: Diagnose macOS Swift shims
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          SDK="$(xcrun --show-sdk-path)"
          TOOLCHAIN="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/macosx"
          echo "xcode: $(xcodebuild -version | tr '\n' ' ')"
          echo "sdk: $SDK"
          echo "--- \$SDK/usr/lib/swift (swift_time/swiftmath entries) ---"
          ls "$SDK/usr/lib/swift" 2>/dev/null | grep -E 'swift_(time|math|errno|signal|stdio|unistd)|swiftsys_time|swift_Builtin_float' || echo "none found in SDK"
          echo "--- host /usr/lib/swift ---"
          ls /usr/lib/swift 2>/dev/null | grep -E 'libswift|\.tbd' | head -20 || echo "none found on host"
          echo "--- toolchain $TOOLCHAIN ---"
          ls "$TOOLCHAIN" 2>/dev/null | head -20 || echo "toolchain dir missing"

      - name: Publish AOT
        run: >-
          dotnet publish src/AegisVault.App/AegisVault.App.csproj
          -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      # REL-1: 7z kept the paths it was given, so packing "$PUBLISH_DIR"/* nested
      # the whole workspace path (v0.2.0/v0.3.0 zips extracted to
      # src/.../publish/). Windows packages through Compress-Archive and asserts
      # the entries stayed flat; the runner's bash `tar` is GNU tar, which has no
      # -a (bsdtar only exists in PowerShell's PATH).
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $publish = "src/AegisVault.App/bin/Release/net10.0/${{ matrix.rid }}/publish"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path $publish -Filter *.pdb -Recurse | Remove-Item -Force
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md -Destination $publish
          $name = "AegisVault-${{ matrix.rid }}-${{ github.ref_name }}"
          $zip = "artifacts/$name.zip"
          Compress-Archive -Path "$publish/*" -DestinationPath $zip -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          try { $entries = @($archive.Entries | ForEach-Object { $_.FullName }) }
          finally { $archive.Dispose() }
          if ($entries -match 'src/') {
            throw "the zip contains the workspace path: $($entries -join ', ')"
          }
          if ($entries -notcontains 'AegisVault.App.exe') {
            throw "the zip is not flat: AegisVault.App.exe is missing at the root"
          }

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  artifacts/$name.zip" | Set-Content -Encoding ascii "artifacts/SHA256SUMS-${{ matrix.rid }}"

      # PKG-1: a per-user installer next to the portable zip. Inno Setup comes
      # from Chocolatey (preinstalled on the Windows runner); Docker is not
      # available on windows-latest, so it must not be the primary path.
      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $publish = (Resolve-Path "src/AegisVault.App/bin/Release/net10.0/${{ matrix.rid }}/publish").Path
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }

          & $iscc "/DAppVersion=$version" "/DPublishDir=$publish" "installer\AegisVault.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $setup = Get-ChildItem artifacts -Filter "AegisVault-${{ matrix.rid }}-setup-v*.exe" | Select-Object -First 1
          if ($null -eq $setup) { throw "installer was not produced" }

          # Keep the manifest honest: the setup executable is published too.
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLower()
          Add-Content -Encoding ascii "artifacts/SHA256SUMS-${{ matrix.rid }}" "$hash  artifacts/$($setup.Name)"

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_DIR="src/AegisVault.App/bin/Release/net10.0/${{ matrix.rid }}/publish"
          mkdir -p artifacts
          find "$PUBLISH_DIR" -name '*.pdb' -delete
          cp LICENSE THIRD-PARTY-NOTICES.md "$PUBLISH_DIR/"
          OUT_NAME="AegisVault-${{ matrix.rid }}-${{ github.ref_name }}"
          # PKG-1: ship the Linux install script inside the tarball so the
          # unpacked folder is self-installing.
          cp installer/install-linux.sh "$PUBLISH_DIR/install.sh"
          chmod +x "$PUBLISH_DIR/install.sh"
          cp src/AegisVault.App/Assets/app.png "$PUBLISH_DIR/app.png"
          tar -czf "artifacts/${OUT_NAME}.tar.gz" -C "$PUBLISH_DIR" .
          shasum -a 256 "artifacts/${OUT_NAME}.tar.gz" > "artifacts/SHA256SUMS-${{ matrix.rid }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisVault-${{ matrix.rid }}
          path: artifacts/*

  release:
    name: release
    needs: publish
    # Ships on any tag push unless the run itself was cancelled. Deliberately
    # NOT gated on needs.publish.result: the matrix skips the macOS legs on a
    # normal tag push, and the docs do not define what needs.<job>.result
    # reports when only part of a matrix runs. Relying on it is what silently
    # skipped this job on 2026-11-12 after both macOS runners were cancelled a
    # second after starting.
    #
    # The real gate is the artifact check below: the release only ships when
    # every mandatory platform actually produced its files, so a failed Windows
    # or Linux build still blocks it with a clear message.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # Not `error` here: when every publish leg failed there is nothing to
          # download, and this step would report a vague "no files found"
          # instead of naming the platform that is actually missing. The guard
          # below checks the specific artifacts and fails with a clear message.
          if-no-files-found: warn

      # A release with only half its checksums is worse than a failed run, so
      # require the two artifacts every tag push is supposed to produce.
      - name: Require the mandatory artifacts
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for rid in win-x64 linux-x64; do
            if ! ls artifacts/*"${rid}"* >/dev/null 2>&1; then
              echo "::error::missing artifacts for ${rid}"
              missing=1
            fi
          done
          if [ ! -f artifacts/SHA256SUMS-win-x64 ]; then
            echo "::error::missing SHA256SUMS-win-x64"
            missing=1
          fi
          if [ ! -f artifacts/SHA256SUMS-linux-x64 ]; then
            echo "::error::missing SHA256SUMS-linux-x64"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "artifacts present:"
            ls -la artifacts || true
            exit 1
          fi
          echo "mandatory artifacts present; macOS artifacts are optional"
          ls -la artifacts

      # Release notes come from CHANGELOG.md (single source of truth) instead of
      # the auto-generated commit list, so the published text matches the repo.
      - name: Extract the release notes for this tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          awk -v header="## [${version}]" '
            index($0, header) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-body.md
          if ! grep -q '[^[:space:]]' release-body.md; then
            echo "::error::no release notes extracted for ${version}"
            exit 1
          fi
          echo "--- release body ---"
          cat release-body.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-body.md
